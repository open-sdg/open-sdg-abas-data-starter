SDG_GOAL: >-
  Section 7: The international financial architecture addresses the unique development circumstances of SIDS
SDG_TARGET: >-
  Target 7.2: International financial and development institutions incorporate multidimensional vulnerability, into their current policies and practices related to debt sustainability and development support**
SDG_INDICATOR: >-
  This target currently has no proposed indicators. Its relevance for Small Island Developing States (SIDS) is recognised, and it is expected that, as discussions progress, an indicator can be proposed to monitor the target.
