SDG_GOAL: >-
  Section 3: SIDS are on the path to environmental sustainability
SDG_TARGET: >-
  Target 3.2: Ensure substantial climate finance flows to SIDS from the global target of at least USD 300 billion per year by 2035 for developing country Parties, in line with the NCQG decision
SDG_INDICATOR: >-
  This target currently has no proposed indicators. Its relevance for Small Island Developing States (SIDS) is recognised, and it is expected that, as discussions progress, an indicator can be proposed to monitor the target. 
