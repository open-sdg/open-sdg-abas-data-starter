national_metadata_blurb: This table provides metadata for the actual indicator available from %country.name 
  statistics closest to the corresponding global ABAS M&E Framework indicator. 
  Please note that even when the global ABAS M&E Framework indicator is fully available 
  from %country.adjective statistics, this table should be consulted for information on national methodology and 
  other %country.adjective-specific metadata information.
global_metadata_blurb: This table will provide information on metadata for ABAS M&E Framework indicators which 
  will be defined by the UN Statistical Commission. <a href="https://unstats.un.org/sdgs/metadata/">Complete
  global SDG metadata</a> is provided by the UN Statistics Division.
